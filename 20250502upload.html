<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <label for="text">文本描述</label> <input id="text" type="text" />
    <label for="file">上传文本</label> <input id="file" onchange="change(event)" type="file" /><span
      onclick="upload(event)"
      style="border: 1px solid gray"
      >上传</span
    >
  </body>
</html>
<script>
  let file = null;
  function change(event){
    file = event.target.files[0];
  }
  async function upload(e) {
    let text = document.querySelector("#text").value;
    if (!text || !file) return alert("请输入文本并选着上传文件");
    console.log(file);
    const form = new FormData();
    form.append("customName", "first");
    form.append("text", "是你呀，小笨蛋。");
    form.append("model", "FunAudioLLM/CosyVoice2-0.5B");
    form.append("file", file);

    const options = {
      method: "POST",
      headers: {
        Authorization:
          "Bearer sk-ychepqialmhtzluehzeqfisyoihlclwmvsshksztfkixwrfc",
      },
    };

    options.body = form;

    fetch("https://api.siliconflow.cn/v1/uploads/audio/voice", options)
      .then((response) => response.json())
      .then((response) => console.log(response))
      .catch((err) => console.error(err));
  }
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        resolve(event.target.result);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file); // 读取文件为DataURL
    });
  }
</script>
