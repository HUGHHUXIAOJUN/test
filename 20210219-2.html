    function bubbleSort(arr) {
      for (let i = 0; i < arr.length - 1; i++) {
        for (let j = 0; j < arr.length - i - 1; j++) {
          if (arr[j] > arr[j + 1]) {
            let temp = arr[j];
            arr[j] = arr[j + 1];
            arr[j + 1] = temp;
          }
        }
      }
      return arr;
    }
    console.log(bubbleSort([1, 2, 1, 1, 2, 4, 5, 3, 2]));
    function quickSort(arr) {
      if (arr.length < 2) return arr;
      let left = [],
        mid = arr.splice(Math.floor(arr.length / 2), 1),
        right = [];
      for (let i = 0; i < arr.length; i++) {
        if (arr[i] < mid) {
          left.push(arr[i]);
        } else {
          right.push(arr[i]);
        }
      }
      return [...quickSort(left), ...mid, ...quickSort(right)];
    }
    function partition(arr, left = 0, right = arr.length - 1) {
      // 将第一个元素设为 pivot
      const pivot = arr[left];

      // 存储索引 = pivot索引 + 1
      let storeIndex = left + 1;

      // 从 i = pivot索引 + 1 到最右索引的遍历
      for (let i = left + 1; i <= right; i++) {
        // 如果 a[i] < a[pivot]
        if (arr[i] < pivot) {
          // 交换 (i, 存储索引)
          [arr[i], arr[storeIndex]] = [arr[storeIndex], arr[i]];
          // 存储索引++
          storeIndex++;
        }
      }

      // 交换 (pivot, 存储索引 - 1)
      [arr[left], arr[storeIndex - 1]] = [arr[storeIndex - 1], arr[left]];

      // 返回 pivot 的最终位置
      return storeIndex - 1;
    }

        let min = i;

    function insertSort(arr) {
      for (let i = 1; i < arr.length; i++) {
        let temp = arr[i],
          j = i - 1;
        while (j >= 0 && arr[j] > temp) {
          arr[j + 1] = arr[j];
          j--;
        }
        arr[j + 1] = temp;
      }
      return arr;
    }

    class Pub {
      constructor() {
        this.collect = {};
      }
      on(eventType, handlers) {
        (this.collect[eventType] || (this.collect[eventType] = [])).push(
          handlers
        );
      }
      emit(eventType) {
        let arms = [].slice.call(arguments, 1);
        console.log(arms);
        this.collect[eventType].forEach((handler) => {
          handler.apply(this, arms);
        });
      }
      del(eventType) {
        this.collect[eventType] = [];
      }
    }

      });
