  function getWeekForma(len,strDate){
    let res = [];
    let date = new Date(strDate);//当前日期
    let week = date.getDay();//当前星期
    // 获取周一
    let week1;
    if(week==0){
      week1 = date.getTime() - 6 * 86400000
    }else{
      week1 = date.getTime() - (week-1) * 86400000
    }
    let week7 = week1 + 6 * 86400000;
    for(let i=0; i<len; i++){
      res.push({
        week1: new Date((week1+i*7*86400000)).toLocaleDateString(),
        week7: new Date((week7+i*7*86400000)).toLocaleDateString(), 
      })
    }
    console.log(res)
    return  res
  }
